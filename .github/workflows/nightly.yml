name: Nightly Build

on:
  push:
    branches: [ "main" ]  # Also build on pushes to main
  workflow_dispatch:      # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Rename JAR file
        run: mv target/qubic-*.jar target/qubic-nightly-${{ steps.sha.outputs.sha }}.jar

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: qubic-nightly-${{ steps.sha.outputs.sha }}
          path: target/qubic-nightly-${{ steps.sha.outputs.sha }}.jar
          retention-days: 14  # Keep builds for 2 weeks